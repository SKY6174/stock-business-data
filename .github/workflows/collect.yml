name: Collect Official KRX Source
on:
  schedule:
    - cron: '45 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/collect.yml', 'scripts/collect.py']
  pull_request:
    paths: ['.github/workflows/collect.yml', 'scripts/collect.py']
permissions:
  contents: read
concurrency:
  group: krx-source-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/collect.py "$RUNNER_TEMP/krx.json"
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'SKY6174/stock-business-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: true
      - run: python3 scripts/collect.py krx.json
      - name: Publish public official data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add krx.json
          git diff --cached --quiet && exit 0
          git commit -m 'data: refresh official public KRX source'
          git push origin HEAD:refs/heads/main
